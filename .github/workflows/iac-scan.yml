name: IaC Security Scan

on:
  pull_request:
  push:
    branches: [main]
    paths:
      - 'infrastructure/**'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  trivy-config:
    name: Trivy IaC Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Trivy
        run: |
          sudo apt-get update
          sudo apt-get install -y wget gnupg
          wget -qO - https://aquasecurity.github.io/trivy-repo/deb/public.key \
            | gpg --dearmor | sudo tee /usr/share/keyrings/trivy.gpg > /dev/null
          echo "deb [signed-by=/usr/share/keyrings/trivy.gpg] https://aquasecurity.github.io/trivy-repo/deb generic main" \
            | sudo tee /etc/apt/sources.list.d/trivy.list
          sudo apt-get update
          sudo apt-get install -y trivy
          trivy --version

      - name: Scan (human readable, report only)
        run: |
          trivy config infrastructure/sg-baseline \
            --tf-vars infrastructure/sg-baseline/terraform.tfvars.example

      - name: Scan (JSON artifact)
        run: |
          mkdir -p scan-results
          trivy config infrastructure/sg-baseline \
            --tf-vars infrastructure/sg-baseline/terraform.tfvars.example \
            --format json \
            --output scan-results/sg-baseline.json

      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: trivy-scan-results
          path: scan-results/
          retention-days: 14
      
      
      - name: Build PR comment
        run: |
          python3 src/pipeline/trivy_to_comment.py \
            scan-results/sg-baseline.json infrastructure/sg-baseline > comment.md
          cat comment.md

      - name: Post PR comment
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh pr comment ${{ github.event.pull_request.number }} --body-file comment.md

      # PR 게이트: 이 PR 에서 바뀐 infrastructure/ 하위 폴더만, 그리고 이 PR 이 "새로 만든" HIGH/CRITICAL 만 막는다.
      # (main 에 의도적 결함 시나리오가 있는 동안 팀원의 코드 PR 이 기존 결함 때문에 막히지 않게 함.
      #  2026-11-10: 예전에는 HIGH 가 하나라도 남으면 실패라서, SSH 만 고치고 원래 있던 egress 지적이 남은 정상 패치 PR 도 막혔다.
      #  이제 PR 의 기준 커밋(base)에서 같은 폴더를 스캔해 비교하고, 새로 생긴 것만 실패로 본다 — scripts/ci_scan_gate.py)
      - name: Gate - fail on NEW HIGH/CRITICAL (pull requests only, changed infra dirs)
        if: github.event_name == 'pull_request'
        run: |
          BASE="${{ github.event.pull_request.base.sha }}"
          CHANGED=$(git diff --name-only "$BASE"...HEAD -- infrastructure/ | xargs -r -n1 dirname | sort -u)
          if [ -z "$CHANGED" ]; then
            echo "infrastructure/ 변경 없음 - 게이트 생략"
            exit 0
          fi
          mkdir -p gate/base-tree
          git archive "$BASE" infrastructure | tar -x -C gate/base-tree
          RC=0
          for d in $CHANGED; do
            [ -d "$d" ] || continue
            case "$d" in *-testbed|*-testbed/*) echo "== skip: $d (시험 환경 폴더 — 결함을 일부러 포함, 게이트 제외)"; continue;; esac
            echo "== gate: $d"
            name=$(echo "$d" | tr '/' '_')
            TFVARS=""
            [ -f "$d/terraform.tfvars.example" ] && TFVARS="--tf-vars $d/terraform.tfvars.example"
            trivy config "$d" $TFVARS --format json --output "gate/$name.head.json" --quiet
            BASEARG=""
            if [ -d "gate/base-tree/$d" ]; then
              BTFVARS=""
              [ -f "gate/base-tree/$d/terraform.tfvars.example" ] && BTFVARS="--tf-vars gate/base-tree/$d/terraform.tfvars.example"
              trivy config "gate/base-tree/$d" $BTFVARS --format json --output "gate/$name.base.json" --quiet
              BASEARG="--base gate/$name.base.json"
            fi
            python3 scripts/ci_scan_gate.py --head "gate/$name.head.json" $BASEARG --severity HIGH,CRITICAL --label "$d" || RC=1
          done
          exit $RC
