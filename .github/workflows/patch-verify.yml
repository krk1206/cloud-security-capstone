name: Patch Verification (mock, offline)

# 목적: PR 마다 단위 테스트 + mock 생성기로 배포 전 파이프라인(V1~V6)을 오프라인 plan 으로 실행하고 기록을 아티팩트로 남긴다.
# 하지 않는 것: terraform apply, AWS 접속, 실제 LLM API 호출, PR 자동 생성/병합. (전부 사람 승인 후 로컬/WSL 에서)
# 주의: 이 워크플로는 아직 GitHub Actions 에서 실행·검증되지 않았다 (docs/STATUS.md). 로컬 스크립트와 같은 명령을 쓴다.

on:
  pull_request:
    paths:
      - 'infrastructure/**'
      - 'src/**'
      - 'policy/**'
      - 'tests/**'
      - 'scenarios/**'
      - '.github/workflows/patch-verify.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-tests:
    name: Unit tests (no external tools)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run unit tests
        run: |
          cd tests/unit
          PYTHONPATH=../../src python -m unittest discover -s . -p "test_*.py" -v

  mock-predeploy:
    name: Mock pre-deploy pipeline (offline plan)
    runs-on: ubuntu-latest
    needs: unit-tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.16.1
          terraform_wrapper: false
      - name: Install Trivy 0.74.0
        run: |
          curl -sSfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b /usr/local/bin v0.74.0
          trivy --version
      - name: Self-check
        run: PYTHONPATH=src python -m iacpatch selfcheck
      - name: Pre-deploy (correct mock patch → expect CREATE_PR_AUTO)
        env:
          IACPATCH_TF_VAR_FILE: terraform.tfvars.example
        run: |
          PYTHONPATH=src python -m iacpatch predeploy --target-dir infrastructure/sg-baseline \
            --intent tests/fixtures/intents/sg-baseline.test.json --scenario ci-ok \
            --generator llm --llm-provider mock --llm-mock-fixture sg_baseline_ok --offline
      - name: Pre-deploy (seeded deceptive patch → expect BLOCK at V6)
        env:
          IACPATCH_TF_VAR_FILE: terraform.tfvars.example
        run: |
          set +e
          PYTHONPATH=src python -m iacpatch predeploy --target-dir infrastructure/sg-baseline \
            --intent tests/fixtures/intents/sg-baseline.test.json --scenario ci-split \
            --generator llm --llm-provider mock --llm-mock-fixture sg_baseline_cidr_split --offline --max-attempts 1
          echo "exit=$?"  # BLOCK 은 정상 동작이며 워크플로를 실패시키지 않는다
          set -e
          grep -l '"action": "BLOCK"' data/runs/*/gate.json
      - name: Upload run records
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: iacpatch-run-records
          path: data/runs/
          retention-days: 14
