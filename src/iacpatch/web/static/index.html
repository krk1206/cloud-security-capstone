<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>IaCPatch — Terraform 보안 수정 검증</title>
<link rel="stylesheet" href="/static/app/app.css">
</head>
<body>
<header id="top">
  <div class="brand">
    <svg class="logo" viewBox="0 0 32 32" aria-hidden="true"><rect x="2" y="2" width="28" height="28" rx="7"/><path d="M9 17l5 5 9-11"/></svg>
    <div><b>IaCPatch</b><span>Terraform 보안 수정 검증 — 문제 해결 · 새 문제 · 고객 설계 유지</span></div>
  </div>
  <div class="case"><span class="lbl">사례</span><b id="caseName">불러오는 중…</b><div class="seg" id="setSwitch" role="tablist" aria-label="검사 영역"></div></div>
  <div class="tools" id="tools"></div>
  <nav class="topnav">
    <a class="navlink" href="/">흐름 화면</a>
    <button type="button" data-action="open-summary">결과 요약</button>
    <button type="button" data-action="open-records">기록</button>
    <button type="button" data-action="open-settings">설정</button>
  </nav>
</header>

<nav id="steps" aria-label="진행 단계">
  <div class="sgrp">준비</div>
  <button type="button" class="step" data-step="1"><em>1</em><span><b>고객 설계도</b><small>허용하는 통신 경로</small></span></button>
  <button type="button" class="step" data-step="2"><em>2</em><span><b>지금 코드의 문제</b><small>알려진 보안 오류 · 설계 위반</small></span></button>
  <button type="button" class="step" data-step="3"><em>3</em><span><b>수정 코드</b><small>후보 선택 또는 직접 제출</small></span></button>
  <div class="sgrp">검사</div>
  <button type="button" class="step" data-step="4"><em>4</em><span><b>배포 전 검사</b><small>코드만 · AWS 접속 없음</small></span></button>
  <button type="button" class="step" data-step="5"><em>5</em><span><b>AWS 시험 환경 검사</b><small>시험 환경에 적용 후 확인 (운영 아님)</small></span></button>
  <div class="sgrp">결정</div>
  <button type="button" class="step" data-step="6"><em>6</em><span><b>승인 결정</b><small>사람이 결정</small></span></button>
</nav>

<main id="stage">
  <div id="diagramCard">
    <div class="dhead">
      <b id="diagramTitle">설계도</b>
      <div class="legend">
        <span class="lg design">설계 기준 경로</span>
        <span class="lg ok">정상 통신 경로</span>
        <span class="lg bad">설계 외 허용 경로</span>
        <span class="lg off">허용 규칙 없는 필수 통신</span>
      </div>
    </div>
    <div id="diagramWrap"><svg id="diagram" role="img" aria-label="3계층 웹 서비스 설계도"></svg></div>
  </div>
  <div id="proofPane" hidden></div>
  <div id="console" class="console min">
    <div class="chead"><b>실행 로그</b><span>이 PC 에서 실행된 명령과 결과</span><button type="button" class="mini" data-action="toggle-console">닫기</button></div>
    <pre id="log"></pre>
  </div>
  <div class="stagebar">
    <span id="stageNote" class="muted"></span>
    <button type="button" class="mini logbtn" data-action="toggle-console">실행 로그 <span id="consoleState">대기</span></button>
  </div>
</main>

<aside id="panel" aria-live="polite"><div id="panelBody"></div></aside>

<div id="toast" role="status"></div>
<div id="overlay" hidden><div class="ov-box" role="dialog" aria-modal="true"><button type="button" class="ov-x" data-action="close-overlay" aria-label="닫기">×</button><div id="ovBody"></div></div></div>
<div id="boot"><div class="boot-core"><svg class="logo big" viewBox="0 0 32 32" aria-hidden="true"><rect x="2" y="2" width="28" height="28" rx="7"/><path d="M9 17l5 5 9-11"/></svg><h1>IaCPatch</h1><ol id="bootLines"></ol></div></div>

<noscript>이 화면은 JavaScript 실행 필요.</noscript>
<script type="module" src="/static/app/app.js"></script>
</body>
</html>
