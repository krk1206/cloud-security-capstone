<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>IaCPatch</title>
<style>
:root{
  --bg:#f6f7f5; --panel:#ffffff; --line:#e4e6e1; --line2:#cfd3cb; --ink:#141613; --ink2:#4a4f48; --ink3:#7d837b; --code:#f0f2ee;
  --accent:#1f5eff; --accent-ink:#fff; --accent-soft:#e8efff;
  --good:#15803d; --good-soft:#e7f6ec; --bad:#c2271d; --bad-soft:#fdebe9; --warn:#b26a00; --warn-soft:#fff4de; --muted:#6b7280; --muted-soft:#eef0ed;
  --r:12px; --gutter:20px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#121412; --panel:#1b1e1b; --line:#2b302b; --line2:#3a403a; --ink:#f1f3ef; --ink2:#c3c8c0; --ink3:#8d948b; --code:#232724;
  --accent:#6b93ff; --accent-soft:#1d2a4a; --good-soft:#163523; --bad-soft:#3f1c19; --warn-soft:#3d2d0f; --muted-soft:#2a2e2a; --good:#5bd38a; --bad:#ff8a7a; --warn:#f0b35a;
}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 "Malgun Gothic","Apple SD Gothic Neo","Noto Sans KR",system-ui,sans-serif}
a{color:var(--accent)}
button{font:inherit;cursor:pointer;border:1px solid var(--line2);background:var(--panel);color:var(--ink);padding:8px 14px;border-radius:9px}
button:hover{background:var(--code)} button:disabled{opacity:.45;cursor:not-allowed}
button.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:700}
button.primary:hover{filter:brightness(.93)}
button.good{border-color:var(--good);color:var(--good);font-weight:700} button.bad{border-color:var(--bad);color:var(--bad)} button.quiet{border-color:transparent;color:var(--ink2)}
input,select,textarea{font:inherit;color:var(--ink);background:var(--panel);border:1px solid var(--line2);border-radius:9px;padding:8px 10px;max-width:100%}
textarea{width:100%;min-height:160px;font-family:Consolas,"D2Coding","Cascadia Mono",monospace;font-size:13px}
code,pre,.mono{font-family:Consolas,"D2Coding","Cascadia Mono",monospace;font-size:13px}
pre{background:var(--code);border:1px solid var(--line);border-radius:9px;padding:10px 12px;overflow:auto;max-height:380px;white-space:pre-wrap;word-break:break-word;margin:6px 0}
.top{background:var(--panel);border-bottom:1px solid var(--line)}
.top .wrap{max-width:1180px;margin:0 auto;padding:12px var(--gutter);display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.brand{font-weight:800;font-size:19px;letter-spacing:.01em} .brand small{display:block;font-weight:500;font-size:12.5px;color:var(--ink3);letter-spacing:0}
.top .sp{flex:1}
.pill{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line2);border-radius:999px;padding:3px 11px;font-size:12.5px;color:var(--ink2);white-space:nowrap}
.pill.ok{border-color:var(--good);color:var(--good)} .pill.bad{border-color:var(--bad);color:var(--bad)} .pill.warn{border-color:var(--warn);color:var(--warn)}
.steps{max-width:1180px;margin:0 auto;padding:10px var(--gutter) 0;display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.step{border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:8px 10px;cursor:pointer;display:flex;gap:9px;align-items:center;min-width:0}
.step .n{width:24px;height:24px;border-radius:50%;background:var(--muted-soft);color:var(--ink2);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:12.5px;flex:0 0 24px}
.step .t{font-size:13.5px;line-height:1.25;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.step.on{border-color:var(--accent);background:var(--accent-soft)} .step.on .n{background:var(--accent);color:#fff} .step.on .t{color:var(--ink);font-weight:700}
.step.done .n{background:var(--good);color:#fff}
@media (max-width:900px){.steps{grid-template-columns:repeat(3,1fr)}}
main{max-width:1180px;margin:0 auto;padding:14px var(--gutter) 70px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;margin:0 0 14px}
.card h2{font-size:17px;margin:0 0 6px} .card h3{font-size:14px;margin:14px 0 6px;color:var(--ink2)}
.lead{font-size:15px;color:var(--ink2);margin:0 0 10px}
.small{color:var(--ink3);font-size:12.5px} .sub{color:var(--ink2);font-size:13.5px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.right{margin-left:auto}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px} .grid2>*{min-width:0} @media (max-width:860px){.grid2{grid-template-columns:1fr}}
.tw{overflow-x:auto} table{border-collapse:collapse;width:100%;font-size:13.5px} th,td{border-bottom:1px solid var(--line);padding:8px 9px;text-align:left;vertical-align:top}
th{color:var(--ink3);font-weight:600;font-size:12.5px;letter-spacing:.02em}
.tag{display:inline-block;border-radius:6px;padding:1px 8px;font-size:12px;font-weight:700;border:1px solid transparent;white-space:nowrap;vertical-align:middle}
.tag.good{background:var(--good-soft);color:var(--good)} .tag.bad{background:var(--bad-soft);color:var(--bad)} .tag.warn{background:var(--warn-soft);color:var(--warn)} .tag.muted{background:var(--muted-soft);color:var(--ink2)} .tag.limit{background:var(--accent-soft);color:var(--accent)} .tag.keep{background:var(--good-soft);color:var(--good)}
.tag.outline{background:transparent;border-color:var(--line2);color:var(--ink2);font-weight:600}
.banner{border-radius:var(--r);padding:16px 18px;margin:0 0 14px;border:1px solid var(--line)}
.banner.good{background:var(--good-soft);border-color:color-mix(in srgb,var(--good) 40%,transparent)} .banner.bad{background:var(--bad-soft);border-color:color-mix(in srgb,var(--bad) 40%,transparent)} .banner.warn{background:var(--warn-soft);border-color:color-mix(in srgb,var(--warn) 45%,transparent)} .banner.muted{background:var(--muted-soft)}
.banner .h{font-size:20px;font-weight:800;margin:0 0 4px} .banner .r{font-size:14.5px;color:var(--ink2)} .banner ul{margin:8px 0 0 18px;padding:0;font-size:13.5px}
.req{display:grid;grid-template-columns:86px 1fr;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)} .req:last-child{border-bottom:0}
.req .st{font-weight:800;font-size:14px} .req .st.PASS{color:var(--good)} .req .st.FAIL{color:var(--bad)} .req .st.UNKNOWN{color:var(--warn)}
.req .tx{font-size:14.5px} .req .why{color:var(--ink2);font-size:13.5px;margin-top:3px} .req .ev{color:var(--ink3);font-size:12.5px;margin-top:2px}
.kv{display:grid;grid-template-columns:max-content 1fr;gap:4px 14px;font-size:13.5px} .kv dt{color:var(--ink3)} .kv dd{margin:0}
details{margin:6px 0} summary{cursor:pointer;color:var(--accent);font-size:13.5px}
.log{background:#0f1311;color:#d9dfda;border-radius:9px;padding:10px 12px;height:220px;overflow:auto;font-family:Consolas,monospace;font-size:12.5px;white-space:pre-wrap;word-break:break-all}
.log .fail{color:#ff8a7a} .log .pass{color:#7fe09b} .log .unk{color:#f0c66a} .log .hdr{color:#8fb3ff;font-weight:700}
.prog{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin:8px 0} .prog i{display:block;height:100%;background:var(--accent);width:0;transition:width .3s}
.check{display:flex;gap:10px;align-items:flex-start;padding:7px 0;border-bottom:1px dashed var(--line);font-size:14px} .check input{margin-top:4px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.ctx{display:flex;gap:10px;align-items:center;flex-wrap:wrap;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 12px;margin:0 0 12px;font-size:13.5px}
.ctx b{font-size:14px}
.empty{color:var(--ink3);padding:16px;text-align:center;border:1px dashed var(--line2);border-radius:10px}
.diffrow{display:grid;grid-template-columns:1fr 24px 1fr;gap:6px;align-items:center;font-family:Consolas,monospace;font-size:12.5px;margin:3px 0}
.diffrow .b{background:var(--bad-soft);padding:3px 7px;border-radius:5px;word-break:break-all} .diffrow .a{background:var(--good-soft);padding:3px 7px;border-radius:5px;word-break:break-all} .diffrow .ar{text-align:center;color:var(--ink3)}
.nav{display:flex;justify-content:space-between;gap:8px;margin-top:6px}
svg text{font-family:"Malgun Gothic","Apple SD Gothic Neo","Noto Sans KR",system-ui,sans-serif}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--ink2);margin-top:4px}
.legend i{display:inline-block;width:22px;border-top:2px solid var(--ink2);vertical-align:middle;margin-right:5px} .legend i.dash{border-top-style:dashed} .legend i.red{border-color:var(--bad)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px;margin:0 0 14px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;min-width:0}
.kpi .v{font-size:30px;font-weight:800;line-height:1.1;font-variant-numeric:tabular-nums} .kpi .l{font-size:13.5px;color:var(--ink);margin-top:4px;font-weight:600} .kpi .s{font-size:12px;color:var(--ink3);margin-top:2px}
.kpi.bad .v{color:var(--bad)} .kpi.good .v{color:var(--good)}
.checks6{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px;margin:0 0 14px} .checks6 .c{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px;min-width:0} .checks6 .c .k{font-size:12.5px;color:var(--ink3);font-weight:600} .checks6 .c .cell{font-size:15px;margin-top:4px} .checks6 .c.FAIL{border-color:var(--bad);background:var(--bad-soft)} .checks6 .c.UNKNOWN{border-color:var(--warn)}
@media (max-width:900px){.checks6{grid-template-columns:repeat(3,minmax(0,1fr))}}
.cell{display:inline-flex;align-items:center;gap:3px;font-weight:700;font-size:12.5px;white-space:nowrap} .cell.PASS{color:var(--good)} .cell.FAIL{color:var(--bad)} .cell.UNKNOWN{color:var(--warn)} .cell.NA{color:var(--ink3);font-weight:500}
table.mx td,table.mx th{text-align:center;padding:7px 6px;vertical-align:middle} table.mx button{padding:3px 10px;border-color:var(--line2);white-space:nowrap} table.mx th{white-space:nowrap} table.mx td:first-child,table.mx th:first-child,table.mx td:nth-child(2),table.mx th:nth-child(2){text-align:left}
.hidden{display:none !important}
</style>
</head>
<body>
<header class="top">
  <div class="wrap">
    <div class="brand">IaCPatch<small>Terraform 수정 후보 검증 · 승인</small></div>
    <div class="sp"></div>
    <span class="pill" id="pill-tools">도구 확인 중…</span>
    <span class="pill" id="pill-job" style="display:none">작업 중…</span>
    <button class="quiet" data-go="summary">결과 요약</button>
    <button class="quiet" data-go="settings">설정</button>
    <a class="quiet" href="/" style="text-decoration:none;padding:6px 12px;border:1px solid var(--line2);border-radius:8px;color:inherit">← 새 화면</a>
  </div>
</header>

<nav class="steps" id="steps">
  <div class="step" data-step="1"><span class="n">1</span><span class="t">요구사항</span></div>
  <div class="step" data-step="2"><span class="n">2</span><span class="t">현재 설정</span></div>
  <div class="step" data-step="3"><span class="n">3</span><span class="t">수정 후보</span></div>
  <div class="step" data-step="4"><span class="n">4</span><span class="t">배포 전 검증</span></div>
  <div class="step" data-step="5"><span class="n">5</span><span class="t">사람의 판단</span></div>
  <div class="step" data-step="6"><span class="n">6</span><span class="t">적용 후 확인</span></div>
</nav>

<main>
  <div id="ctx" class="ctx hidden"></div>
  <section id="view"></section>
</main>

<script>
(function(){
'use strict';
const $ = (s, el=document) => el.querySelector(s);
const $$ = (s, el=document) => Array.from(el.querySelectorAll(s));
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function api(path, body){
  const r = await fetch(path, body ? {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(body)} : {});
  const j = await r.json().catch(()=>({error:'응답을 읽을 수 없음'}));
  if(!r.ok && !j.error) j.error = 'HTTP ' + r.status;
  return j;
}
const S = {app:null, caseId:'webapp-2tier', case:null, current:null, cands:null, recordId:null, record:null, step:1, settings:false, setId:null, records:null};
const toneOf = v => v==='PASS'?'good':v==='FAIL'?'bad':v==='UNKNOWN'?'warn':'muted';
const tag = (text, tone) => `<span class="tag ${tone||'muted'}">${esc(text)}</span>`;
const fmtTime = s => s ? String(s).replace('T',' ').slice(0,16) : '';
const toolLine = t => t ? Object.entries(t).map(([k,v])=>`${k} ${v && v.version ? v.version : (typeof v==='string'? v : '없음')}`).join(' · ') : '';

// ---------------- 상단
setInterval(()=>fetch('/api/heartbeat',{method:'POST'}).catch(()=>{}), 15000);
fetch('/api/heartbeat',{method:'POST'}).catch(()=>{});
async function loadApp(){
  S.app = await api('/api/app');
  const p = $('#pill-tools');
  if(S.app.error){ p.textContent = '서버 오류'; p.className='pill bad'; return; }
  const t = S.app.tools || {};
  const ok = S.app.tools_ok;
  p.className = 'pill ' + (ok ? 'ok' : 'warn');
  p.textContent = ok ? `이 PC에서 실행 가능 · ${Object.entries(t).map(([k,v])=>k+' '+String(v.version||'').replace('Version: ','')).join(' · ')}`
                     : '이 PC에 Trivy·Terraform 없음 — 저장된 실행 기록만 표시';
}
$$('[data-go]').forEach(b => b.onclick = () => go(b.dataset.go));
$$('#steps .step').forEach(el => el.onclick = () => go(Number(el.dataset.step)));
function go(where){
  S.settings = where==='settings'; S.summary = where==='summary';
  if(!S.settings && !S.summary) S.step = where;
  location.hash = S.settings ? 'settings' : S.summary ? 'summary' : ('step-' + S.step);
  render();
}
function markSteps(){
  const page = S.settings || S.summary;
  $$('#steps .step').forEach(el => { const n = Number(el.dataset.step); el.classList.toggle('on', !page && n===S.step); el.classList.toggle('done', !page && n < S.step); });
}
function ctxBar(){
  const c = $('#ctx');
  if(S.settings || S.summary || !S.case){ c.classList.add('hidden'); return; }
  const parts = [`<b title="${esc(S.case.tf_dir)}">${esc(S.case.name)}</b>`];
  if(S.record){ const r = S.record; parts.push(tag(r.set ? r.set.label : '', 'outline'), `<span>후보 <b>${esc(r.candidate_id||'')}</b></span>`, tag(r.candidate.origin.label,'outline'), tag(r.classification.label, r.classification.tone), `<span class="small">실행 ${esc(fmtTime(r.state.finished_at||r.state.started_at))}</span>`); }
  c.innerHTML = parts.join(' ');
  c.classList.remove('hidden');
}

// ---------------- 작업(검토 실행) 폴링
let pollTimer = null, logSince = 0, logEl = null, jobDone = null;
function startJob(el, cb){ logEl = el; if(el) el.innerHTML=''; logSince = 0; jobDone = cb; $('#pill-job').style.display=''; clearTimeout(pollTimer); pollTimer = setTimeout(poll, 300); }
async function poll(){
  const j = await api('/api/log?since=' + logSince);
  if(j.error){ pollTimer = setTimeout(poll, 1500); return; }
  if(logEl && j.log.length){ for(const line of j.log){ const d = document.createElement('div'); d.textContent = line; if(/FAIL|오류|Traceback/.test(line)) d.className='fail'; else if(/UNKNOWN|NOT_RUN/.test(line)) d.className='unk'; else if(/PASS|완료/.test(line)) d.className='pass'; else if(line.startsWith('====')) d.className='hdr'; logEl.appendChild(d);} logEl.scrollTop = logEl.scrollHeight; logSince = j.log_total; }
  const [i,n] = j.progress; const pr = $('#jobprog'); if(pr) pr.style.width = (n? Math.round(100*i/n):0) + '%';
  $('#pill-job').textContent = '작업 중… ' + (n ? `${i}/${n}` : '');
  if(j.running){ pollTimer = setTimeout(poll, 700); return; }
  $('#pill-job').style.display='none';
  const cb = jobDone; jobDone = null; if(cb) cb(j);
}

// ---------------- 자료 로드
async function ensureCase(){ if(!S.case){ S.case = await api('/api/case?id=' + S.caseId); } return S.case; }
async function loadCurrent(force){ if(force || !S.current){ S.current = await api('/api/case/current?id=' + S.caseId); } return S.current; }
async function loadCands(force){ if(force || !S.cands){ S.cands = await api('/api/case/candidates?id=' + S.caseId); } return S.cands; }
async function loadRecord(id, force){ if(id && (force || S.recordId !== id || !S.record)){ S.recordId = id; S.record = await api('/api/record?id=' + encodeURIComponent(id)); try{localStorage.setItem('iacpatch-record', id);}catch(e){} } return S.record; }

// ---------------- 아키텍처 그림
function archSvg(arch, opt){
  opt = opt || {};
  const inst = (arch && arch.instances) || [];
  const subs = (arch && arch.subnets) || [];
  const pub = subs.find(s=>s.public) , prv = subs.find(s=>!s.public);
  const web = inst.find(i=> pub && i.subnet===pub.address) || inst[0];
  const app = inst.find(i=> prv && i.subnet===prv.address) || inst[1];
  const bucket = (arch && arch.buckets||[])[0]; const role = (arch && arch.roles||[])[0];
  const ink = 'var(--ink)', ink2='var(--ink2)', line='var(--line2)', bad='var(--bad)', good='var(--good)';
  const sshBad = !!opt.sshOpen;
  const node = (x,y,w,h,label,sub,fill) => `<g><rect x="${x}" y="${y}" width="${w}" height="${h}" rx="10" fill="${fill||'var(--panel)'}" stroke="${line}"/><text x="${x+w/2}" y="${y+h/2-(sub?4:0)}" text-anchor="middle" dominant-baseline="middle" font-size="13.5" font-weight="700" fill="${ink}">${esc(label)}</text>${sub?`<text x="${x+w/2}" y="${y+h/2+13}" text-anchor="middle" dominant-baseline="middle" font-size="11.5" fill="${ink2}">${esc(sub)}</text>`:''}</g>`;
  const arrow = (x1,y1,x2,y2,label,kind,dy,t) => { const col = kind==='bad'?bad:kind==='dash'?ink2:good; const dash = kind==='dash'?' stroke-dasharray="6 5"':''; const mk = kind==='bad'?'url(#ab)':kind==='dash'?'url(#ad)':'url(#ag)'; t = (t==null?0.5:t); const mx=x1+(x2-x1)*t, my=y1+(y2-y1)*t + (dy==null?-8:dy); return `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${col}" stroke-width="2"${dash} marker-end="${mk}"/><text x="${mx}" y="${my}" text-anchor="middle" font-size="12" fill="${col}" font-weight="600" paint-order="stroke" stroke="var(--panel)" stroke-width="4" stroke-linejoin="round">${esc(label)}</text>`; };
  return `<svg viewBox="0 0 920 300" width="100%" style="max-width:920px;display:block" role="img" aria-label="시연 환경 구성">
  <defs><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="${good}"/></marker><marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="${bad}"/></marker><marker id="ad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="${ink2}"/></marker></defs>
  <rect x="250" y="14" width="420" height="272" rx="14" fill="none" stroke="${line}" stroke-dasharray="4 4"/><text x="262" y="34" font-size="12" fill="${ink2}">VPC</text>
  <rect x="266" y="46" width="180" height="222" rx="12" fill="var(--accent-soft)" stroke="none"/><text x="278" y="66" font-size="12" fill="${ink2}">공개 서브넷</text>
  <rect x="474" y="46" width="180" height="222" rx="12" fill="var(--muted-soft)" stroke="none"/><text x="486" y="66" font-size="12" fill="${ink2}">비공개 서브넷</text>
  ${node(296,110,120,64,'웹 서버', web? web.name+' · HTTP 80':'HTTP 80')}
  ${node(504,110,120,64,'앱 서버', app? app.name+' · 8080':'8080')}
  ${node(300,208,112,44,'웹 서버 역할', role? '자산 버킷 읽기':'', 'var(--panel)')}
  ${node(730,110,150,64,'자산 버킷', bucket? bucket.name.replace(/^iacpatch-/,'') : 'S3')}
  ${node(40,70,150,50,'일반 사용자','인터넷 어디서나')}
  ${node(40,150,150,50,'운영자','지정 대역 (10.0.0.0/8)')}
  ${sshBad? node(40,230,150,50,'인터넷 전체','승인 밖 출처') : ''}

// ---------------- 화면 2 현재 설정
async function viewStep2(){
  await ensureCase();
  const cur = await loadCurrent();
  if(cur.error) return `<div class="card"><p>${esc(cur.error)}</p></div>`;
  if(!cur.ok) return `<div class="banner warn"><div class="h">판단 불가 — 원본 설정을 아직 계산하지 못함</div><div class="r">${esc(cur.reason)}</div></div><div class="nav"><button data-next="1">← 요구사항</button><button class="primary" data-next="3">수정 후보로 →</button></div>`;
  const anySshViol = (cur.sets||[]).some(s => (s.rows||[]).some(r => r.verdict==='FAIL' && /SSH/.test(r.text) && r.kind==='limit'));
  const totalV = cur.sets.reduce((a,s)=>a+(s.n_violated||0),0), totalU = cur.sets.reduce((a,s)=>a+(s.n_unknown||0),0);
  const head = totalV ? `<div class="banner bad"><div class="h">현재 설정은 요구사항 ${totalV}개를 어긴다${totalU?` · 판단 불가 ${totalU}개`:''}</div><div class="r">원본 Terraform 의 실행 계획(plan)에 요구사항을 대입한 결과. ${esc(cur.computed)} · 근거: ${esc(cur.plan_source)}</div></div>`
                      : `<div class="banner ${totalU?'warn':'good'}"><div class="h">${totalU?`판단 불가 ${totalU}개`:'현재 설정은 모든 요구사항을 충족한다'}</div><div class="r">${esc(cur.computed)} · 근거: ${esc(cur.plan_source)}</div></div>`;
  const sets = cur.sets.map(s => {
    if(!s.ok) return `<div class="card"><h2>${esc(s.label)}</h2><p class="sub">${esc(s.reason)}</p></div>`;
    const rows = s.rows.map(r => `<div class="req"><div class="st ${esc(r.verdict)}">${esc(r.status_ko)}</div><div><div class="tx">${tag(r.kind==='limit'?'제한':'유지', r.kind)} ${esc(r.text)}</div>
      ${r.verdict!=='PASS' ? `<div class="why">${(r.reasons||[]).map(esc).join('<br>')}</div>` : (r.where&&r.where.length?`<div class="ev">확인 대상: ${r.where.map(esc).join(', ')}</div>`:'')}
      ${r.verdict==='FAIL' && r.where && r.where.length ? `<div class="ev">영향 받는 대상: ${r.where.map(esc).join(', ')}${r.evidence&&r.evidence.length?' · 근거 규칙: '+r.evidence.map(esc).join(', '):''}</div>`:''}
      ${r.verdict==='FAIL' && r.effective && r.effective.length ? `<div class="ev">지금 허용된 출처: ${r.effective.map(esc).join(', ')}${r.approved&&r.approved.length?' · 승인된 출처: '+r.approved.map(esc).join(', '):''}</div>`:''}
    </div></div>`).join('');
    return `<div class="card"><h2>${esc(s.label)} <span class="small">— 위반 ${s.n_violated} · 판단 불가 ${s.n_unknown} · 충족 ${s.rows.length - s.n_violated - s.n_unknown}</span></h2>${rows}${s.disclaimer?`<p class="small" style="margin-top:8px">판정 범위: ${esc(s.disclaimer)}</p>`:''}</div>`;
  }).join('');
  return head + `<div class="card">${archSvg(S.case.architecture, {sshOpen: anySshViol})}</div>` + sets + `<div class="nav"><button data-next="1">← 요구사항</button><button class="primary" data-next="3">다음 — 수정 후보 →</button></div>`;
}

      <button id="btn-paste-toggle">후보 붙여넣기</button></div>
    <div id="paste-box" class="hidden"><p class="sub">대상 파일(<code>${esc((set.resource||'').split('.')[0]==='aws_security_group'?'security_groups.tf':'iam.tf')}</code>)의 <b>전체 내용</b>을 고친 버전을 붙여 넣는다. AI 가 만든 것이면 그대로 붙여 넣으면 되고, 출처는 '붙여넣기' 로 기록된다.</p><textarea id="paste"></textarea><div class="row" style="margin-top:6px"><button class="primary" ${canRun?'':'disabled'} id="btn-paste-run">붙여넣은 후보 검토</button></div></div>
    <div class="tw"><table><thead><tr><th>후보</th><th>출처</th><th>분류</th><th>검증 결과</th><th>실행</th><th></th></tr></thead><tbody>${rows||'<tr><td colspan="6" class="small">후보 없음</td></tr>'}</tbody></table></div>

function bindStep3(){
  $$('[data-set]').forEach(b => b.onclick = () => { S.setId = b.dataset.set; render(); });
  $$('[data-open]').forEach(b => b.onclick = async () => { await loadRecord(b.dataset.open, true); go(4); });
  $$('[data-run]').forEach(b => b.onclick = () => runReview({set_id: S.setId, candidate_id: b.dataset.run}));
  const pt = $('#btn-paste-toggle'); if(pt) pt.onclick = () => $('#paste-box').classList.toggle('hidden');
  const pr = $('#btn-paste-run'); if(pr) pr.onclick = () => { const t = $('#paste').value; if(!t.trim()){ alert('붙여넣을 내용이 비어 있다'); return; } runReview({set_id: S.setId, paste: t}); };
  const all = $('#btn-all'); if(all) all.onclick = () => runReviewAll();
}
async function runReview(body){
  const cd = S.cands; const set = cd.sets.find(s=>s.set_id===body.set_id);
  const c = set && set.candidates.find(x=>x.id===body.candidate_id);
  if(c && c.candidate_ref==='rule_based') body.generator = 'rule_based';
  body.case_id = S.caseId;
  const r = await api('/api/review', body);
  if(!r.started){ $('#jobstatus').textContent = r.error || '이미 다른 작업이 돌고 있다'; $('#jobbox').classList.remove('hidden'); return; }
  $('#jobbox').classList.remove('hidden'); $('#jobstatus').textContent = '검토 실행 중 — Trivy 재점검 → Terraform 검사·plan → 요구사항 대입 → 위험도 (6~30초, 처음은 더 걸림)';
  startJob($('#joblog'), async j => { if(j.error){ $('#jobstatus').textContent = '실패: ' + j.error; return; } const res = j.result||{}; $('#jobstatus').textContent = '끝 — 결과를 연다'; await loadCands(true); if(res.record_id){ await loadRecord(res.record_id, true); go(4); } else render(); });
}
async function runReviewAll(){
  const r = await api('/api/review_all', {case_id: S.caseId, set_id: S.setId});
  if(!r.started){ $('#jobstatus').textContent = r.error || '이미 다른 작업이 돌고 있다'; $('#jobbox').classList.remove('hidden'); return; }
  $('#jobbox').classList.remove('hidden'); $('#jobstatus').textContent = '후보를 차례로 검토하는 중…';
  startJob($('#joblog'), async j => { $('#jobstatus').textContent = j.error ? '실패: '+j.error : '끝'; await loadCands(true); render(); });
}

  <div class="checks6">${CHECKS.map(([k,l],i)=>{ const L=(r.layers||[]).find(x=>x.layer===k); const v=L?L.verdict:null; const kk=(v==='PASS'||v==='WARN')?'PASS':v==='FAIL'?'FAIL':(v==='UNKNOWN'||v==='ERROR'||v==='INCOMPLETE')?'UNKNOWN':'NA'; return `<div class="c ${kk}"><div class="k">${i+1} ${esc(l)}</div>${cellOf(v)}</div>`; }).join('')}</div>
  <div class="card">
    <h2>요구사항별 결과 <span class="small">— 수정 전(현재 설정) → 수정 후(이 후보)</span></h2>

const CHECKS = [['V1','지적 사라짐'],['V2','새 문제 없음'],['V3','문법'],['V4','실행 계획'],['V5','허용 범위'],['V6','요구사항']];
function cellOf(v){
  const k = (v==='PASS'||v==='WARN') ? 'PASS' : v==='FAIL' ? 'FAIL' : (v==='UNKNOWN'||v==='ERROR'||v==='INCOMPLETE') ? 'UNKNOWN' : 'NA';
  const t = {PASS: v==='WARN'?'✓ 통과(경고)':'✓ 통과', FAIL:'✕ 실패', UNKNOWN:'? 판단 불가', NA:'– 안 함'}[k];
  return `<span class="cell ${k}">${t}</span>`;
}
function finalOf(r){
  if(!r) return {t:'검토 전', tone:'muted', k:'none'};
  if(r.state==='VALIDATION_FAILED') return {t:'차단 — 검증 실패', tone:'bad', k:'blocked'};
  if(r.state==='POLICY_BLOCKED') return {t:'차단 — 허용 범위 밖', tone:'bad', k:'blocked'};
  if(r.state==='REVIEW_REQUIRED' && r.level==='PENDING') return {t:'판단 불가', tone:'warn', k:'unknown'};
  if(r.state==='REVIEW_REQUIRED') return {t:'통과 — '+(r.level_ko||'').replace(/^통과 — /,''), tone:'good', k:'pass'};
  return {t:r.state_ko||r.state||'', tone:'muted', k:'other'};
}

}
function bindSummary(){
  $$('[data-open]').forEach(b => b.onclick = async () => { await loadRecord(b.dataset.open, true); go(4); });
}

// ---------------- 설정
async function viewSettings(){
  const a = S.app || await api('/api/app');
  const recs = S.records || (S.records = (await api('/api/records')).records || []);
  const tools = Object.entries(a.tools||{}).map(([k,v])=>`<dt>${esc(k)}</dt><dd>${v.ok?tag('있음','good'):tag('없음','bad')} ${esc(v.version)}</dd>`).join('');
  const rows = recs.map(r => `<tr><td class="mono small">${esc(fmtTime(r.started_at))}</td><td class="mono small">${esc(r.scenario)}</td><td>${tag(r.classification.label, r.classification.tone)}</td><td>${tag(r.level_ko||r.state_ko,'outline')}</td><td>${r.decision_ko?tag(r.decision_ko,'outline'):''}</td><td><button data-open="${esc(r.id)}">열기</button></td></tr>`).join('');
  return `
  <div class="card"><h2>이 PC 의 도구</h2><dl class="kv">${tools}<dt>Python</dt><dd>${esc(a.python)}${a.frozen?' (실행 파일 내장)':''}</dd></dl>
    <div class="row" style="margin-top:8px"><button class="primary" id="btn-tools">Trivy · Terraform 설치/확인</button><span class="small">tools\\ 폴더에 받는다. 인터넷 필요.</span></div>
    <div id="jobbox" class="hidden"><div class="prog"><i id="jobprog"></i></div><div class="small" id="jobstatus"></div><div class="log" id="joblog"></div></div>
    ${a.selfcheck_ok?'':`<p class="small" style="color:var(--bad)">설치 상태 문제: ${(a.selfcheck||[]).map(esc).join(' / ')} — ${esc(a.hint)}</p>`}
  </div>
  <div class="card"><h2>검토 기록 전체 <span class="small">${recs.length}건</span></h2><div class="tw"><table><thead><tr><th>시작</th><th>사례/후보</th><th>분류</th><th>결과</th><th>결정</th><th></th></tr></thead><tbody>${rows||'<tr><td colspan="6" class="small">기록 없음</td></tr>'}</tbody></table></div></div>
  <div class="card"><h2>이 프로그램이 하는 것 / 하지 않는 것</h2>
    <p class="sub"><b>한다</b> — Trivy 재점검, Terraform 검사·오프라인 plan, 요구사항 대입(허용 집합 계산), 허용 범위 검사, 위험도 산정, 검토 수준 결정, 사람의 결정 기록, PR 초안 작성, 배포 후 측정 기록 읽기.</p>
    <p class="sub"><b>하지 않는다</b> — ${(a.does_not||[]).map(esc).join(', ')}. 요구사항을 추론하지 않는다. 결과가 없는 검증을 통과로 채우지 않는다.</p>
    <details><summary>개발용: 실험 재현 · 리포트</summary><div class="row" style="margin-top:6px"><button id="btn-exp">실험 전체 실행</button><button id="btn-rep">리포트만 다시 생성</button><a href="/report/" target="_blank">리포트 열기</a></div></details>
  </div>
  <div class="nav"><button data-next="1">← 검토 화면으로</button><span></span></div>`;
}
function bindSettings(){
  $$('[data-open]').forEach(b => b.onclick = async () => { await loadRecord(b.dataset.open, true); go(4); });
  const t = $('#btn-tools'); if(t) t.onclick = async () => { const r = await api('/api/job/setup_tools', {}); $('#jobbox').classList.remove('hidden'); if(!r.started){ $('#jobstatus').textContent = r.error||'이미 다른 작업이 돌고 있다'; return; } $('#jobstatus').textContent='설치 중…'; startJob($('#joblog'), async ()=>{ $('#jobstatus').textContent='끝'; await loadApp(); }); };
  const e = $('#btn-exp'); if(e) e.onclick = async () => { const r = await api('/api/job/run_all', {fresh:false, report_only:false}); $('#jobbox').classList.remove('hidden'); if(!r.started){ $('#jobstatus').textContent = r.error||'이미 다른 작업이 돌고 있다'; return; } $('#jobstatus').textContent='실험 실행 중…'; startJob($('#joblog'), j=>{ $('#jobstatus').textContent = j.error?('실패: '+j.error):'끝'; }); };
  const p = $('#btn-rep'); if(p) p.onclick = async () => { const r = await api('/api/job/run_all', {fresh:false, report_only:true}); $('#jobbox').classList.remove('hidden'); if(!r.started){ $('#jobstatus').textContent = r.error||'이미 다른 작업이 돌고 있다'; return; } startJob($('#joblog'), j=>{ $('#jobstatus').textContent = j.error?('실패: '+j.error):'끝'; }); };
}

// ---------------- 렌더
async function render(){
  markSteps();
  const v = $('#view');
  v.innerHTML = '<div class="small" style="padding:10px">불러오는 중…</div>';
  try{
    let html;
    if(S.settings) html = await viewSettings();
    else if(S.summary) html = await viewSummary();
    else html = await ({1:viewStep1,2:viewStep2,3:viewStep3,4:viewStep4,5:viewStep5,6:viewStep6}[S.step]||viewStep1)();
    v.innerHTML = html;
  }catch(e){ v.innerHTML = `<div class="card"><h2>화면 오류</h2><pre>${esc(e && e.stack || e)}</pre></div>`; }
  ctxBar();
  $$('[data-next]').forEach(b => b.onclick = () => go(Number(b.dataset.next)));
  if(S.settings) bindSettings(); else if(S.summary) bindSummary(); else if(S.step===3) bindStep3(); else if(S.step===4) bindStep4(); else if(S.step===5) bindStep5(); else if(S.step===6) bindStep6();
  window.scrollTo({top:0});
}
(async function boot(){
  await loadApp();
  const h = location.hash.replace('#','');
  if(h==='settings') S.settings = true; else if(h==='summary') S.summary = true; else if(/^step-\d$/.test(h)) S.step = Number(h.slice(5));
  if(S.app && S.app.job && S.app.job.running){ $('#pill-job').style.display=''; startJob(null, ()=>render()); }
  render();
})();
window.addEventListener('hashchange', () => { const h = location.hash.replace('#',''); S.settings = h==='settings'; S.summary = h==='summary'; if(/^step-\d$/.test(h)) S.step=Number(h.slice(5)); render(); });
})();
</script>
</body>
</html>
