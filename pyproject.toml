[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "iacpatch"
version = "0.1.0"
description = "AWS IaC security patch verification pipeline (capstone) - stdlib only"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
iacpatch = "iacpatch.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"iacpatch.generator" = ["prompts/*.md"]
